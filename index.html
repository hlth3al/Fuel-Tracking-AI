<script>
function triggerAction(type) {
  const log = document.getElementById('console-log');
  const item = document.createElement('div');
  const now = new Date().toLocaleTimeString('fa-IR');
  
  if(type === 'MASS_BALANCE') {
    item.innerHTML = `[${now}] <span style="color:#00ff88;">[موازنه جرمی]</span> داده‌های خروجی با دبی‌سنج‌های کوریولیس تطبیق داده شد؛ انحراف در بازه مجاز (۰٫۰۲٪).`;
  } else if(type === 'ANOMALY') {
    item.innerHTML = `[${now}] <span style="color:#ffbe0b;">[الگوریتم ANFIS]</span> اسکن ناهنجاری پایان یافت؛ الگوی مشکوک در مسیر لوله ناحیه مرزی کشف نشد.`;
  } else if(type === 'ISOLATE') {
    item.innerHTML = `[${now}] <span style="color:#ff3366;">[ایزولاسیون]</span> سیگنال آماده‌باش به شیرهای خودکار (ESDV) و سامانه‌های لبه نازل صادر شد.`;
  }
  
  log.appendChild(item);
  log.scrollTop = log.scrollHeight;
}

function toggleAccordion(btn) {
  btn.classList.toggle("active");
  const content = btn.nextElementSibling;
  if (content.style.display === "block") {
    content.style.display = "none";
  } else {
    content.style.display = "block";
  }
}
</script>
